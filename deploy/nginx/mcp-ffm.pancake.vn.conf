# Nginx site cho ffm-mcp remote server.
# Đặt trên SERVER NGINX (đã có cert) — proxy mcp-ffm.pancake.vn → VM chạy node dist/http.js.
#
# Cài đặt:
#   1. Copy file này vào /etc/nginx/conf.d/  (hoặc /etc/nginx/sites-available/ + symlink sang sites-enabled/).
#   2. Thay <VM_IP> bằng IP nội bộ của VM.
#   3. Nếu cert đã quản ở chỗ khác (include chung / wildcard) thì bỏ 2 dòng ssl_certificate* + chỉnh listen cho khớp.
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# Lưu ý quan trọng: response MCP là Streamable HTTP (text/event-stream) → BẮT BUỘC
# proxy_buffering off + HTTP/1.1, nếu không tool call sẽ bị treo/đệm.

upstream ffm_mcp {
    server <VM_IP>:8080;
    keepalive 32;
}

# HTTP → HTTPS (bỏ nếu redirect đã xử lý ở nơi khác)
server {
    listen 80;
    listen [::]:80;
    server_name mcp-ffm.pancake.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp-ffm.pancake.vn;

    # Bỏ 2 dòng này nếu cert được include từ cấu hình chung.
    ssl_certificate     /etc/letsencrypt/live/mcp-ffm.pancake.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-ffm.pancake.vn/privkey.pem;

    # Export nhiều đơn → payload có thể lớn.
    client_max_body_size 10m;

    location / {
        proxy_pass http://ffm_mcp;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Streamable HTTP / SSE: để stream chảy realtime, không đệm.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
