# Nginx site cho ffm-mcp remote server.
# Đặt trên SERVER NGINX — proxy mcp-ffm.pancake.vn → VM chạy node dist/http.js.
#
# Cài đặt:
#   1. Copy vào /etc/nginx/conf.d/  (hoặc sites-available/ + symlink sites-enabled/).
#   2. Thay <VM_IP> bằng IP của VM.
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Xin cert + tự thêm HTTPS:
#        sudo certbot --nginx -d mcp-ffm.pancake.vn
#      → certbot sẽ tự thêm block "listen 443 ssl", ssl_certificate*, và redirect 80→443
#        vào chính file này. KHÔNG cần khai báo ssl tay.
#
# Lưu ý: response MCP là Streamable HTTP (text/event-stream) → BẮT BUỘC
# proxy_buffering off + HTTP/1.1, nếu không tool call sẽ bị treo/đệm.

upstream ffm_mcp {
    server <VM_IP>:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp-ffm.pancake.vn;

    # Export nhiều đơn → payload có thể lớn.
    client_max_body_size 10m;

    location / {
        proxy_pass http://ffm_mcp;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Streamable HTTP / SSE: để stream chảy realtime, không đệm.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
